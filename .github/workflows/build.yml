name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unzip
        run: unzip -q ChiragRanks-source.zip
      - name: Build
        run: mvn -B clean package
        working-directory: ChiragRanks
      - name: Show jar
        run: find . -name "*.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: ChiragRanks
          path: ChiragRanks/target/*.jar
