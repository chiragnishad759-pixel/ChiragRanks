name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q ChiragRanks-source.zip
      - run: mvn -B clean package
        working-directory: ChiragRanks
      - uses: actions/upload-artifact@v4
        with:
          name: ChiragRanks
          path: ChiragRanks/target/ChiragRanks.jar￼Enter
